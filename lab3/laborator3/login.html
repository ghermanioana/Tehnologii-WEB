<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Autentificare</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="light">

<nav>
    <a href="index.html">🏠 Acasă</a>
    <a href="preferences.html">⚙ Preferințe</a>
    <a href="cookies-info.html">🍪 Cookies</a>
    <a href="login.html">🔑 Autentificare</a>
</nav>

<div class="container">
    <div class="login-card">
        <h1>🔑 Autentificare</h1>

        <div id="alert-box"></div>

        <div class="form-group">
            <label for="username">Nume utilizator</label>
            <input type="text" id="username" placeholder="Introduceți username-ul">
        </div>

        <div class="form-group">
            <label for="password">Parolă</label>
            <input type="password" id="password" placeholder="Introduceți parola">
        </div>

        <div class="form-group checkbox-group">
            <label class="checkbox-label">
                <input type="checkbox" id="remember">
                Ține-mă minte
            </label>
        </div>

        <button class="btn-save" style="width:100%" onclick="autentificare()">🔑 Autentificare</button>

        <p style="text-align:center; margin-top:16px; font-size:14px; opacity:0.7;">
            Nu ai cont? <a href="register.html" class="link">Înregistrează-te</a>
        </p>
    </div>
</div>

<script src="js/cookies.js"></script>
<script src="js/storage.js"></script>
<script>
    const defaultUsers = [
        { id: 1, username: 'admin', password: 'password', email: 'admin@example.com' },
        { id: 2, username: 'student', password: 'student123', email: 'student@example.com' }
    ];

    function initPage() {
        const theme = CookieManager.get('theme') || 'light';
        document.body.className = theme;

        const users = StorageManager.getLocal('users');
        if (!users || users.length === 0) {
            StorageManager.setLocal('users', defaultUsers);
        }

        const savedUsername = StorageManager.getLocal('rememberedUsername');
        if (savedUsername) {
            document.getElementById('username').value = savedUsername;
            document.getElementById('remember').checked = true;
        }
    }

    function autentificare() {
        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value;
        const remember = document.getElementById('remember').checked;

        if (!username || !password) {
            showAlert('Completați toate câmpurile!', 'error');
            return;
        }

        const users = StorageManager.getLocal('users') || [];
        const user = users.find(u => u.username === username && u.password === password);

        if (!user) {
            showAlert('Username sau parolă incorectă!', 'error');
            return;
        }

        if (remember) {
            StorageManager.setLocal('rememberedUsername', username);
        } else {
            StorageManager.removeLocal('rememberedUsername');
        }

        const session = {
            userId: user.id,
            username: user.username,
            email: user.email,
            loginTime: new Date().toISOString(),
            sessionId: 'sess_' + Math.random().toString(36).substr(2, 9)
        };
        StorageManager.setSession('currentUser', session);

        showAlert('✅ Autentificat cu succes! Redirecționare...', 'success');
        setTimeout(() => { window.location.href = 'dashboard.html'; }, 1200);
    }

    function showAlert(msg, type) {
        document.getElementById('alert-box').innerHTML = '<div class="alert-' + type + '">' + msg + '</div>';
    }

    initPage();
</script>
</body>
</html>
