<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Înregistrare</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="light">

<nav>
    <a href="index.html">🏠 Acasă</a>
    <a href="preferences.html">⚙ Preferințe</a>
    <a href="cookies-info.html">🍪 Cookies</a>
    <a href="login.html">🔑 Autentificare</a>
</nav>

<div class="container">
    <div class="login-card">
        <h1>📝 Înregistrare</h1>

        <div id="alert-box"></div>

        <div class="form-group">
            <label for="username">Nume utilizator <span class="hint">(minim 3 caractere)</span></label>
            <input type="text" id="username" placeholder="Alegeți un username">
        </div>

        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" placeholder="exemplu@email.com">
        </div>

        <div class="form-group">
            <label for="password">Parolă <span class="hint">(minim 6 caractere)</span></label>
            <input type="password" id="password" placeholder="Alegeți o parolă">
        </div>

        <div class="form-group">
            <label for="confirm-password">Confirmare parolă</label>
            <input type="password" id="confirm-password" placeholder="Repetați parola">
        </div>

        <button class="btn-save" style="width:100%" onclick="inregistrare()">📝 Creează cont</button>

        <p style="text-align:center; margin-top:16px; font-size:14px; opacity:0.7;">
            Ai deja cont? <a href="login.html" class="link">Autentifică-te</a>
        </p>
    </div>
</div>

<script src="js/cookies.js"></script>
<script src="js/storage.js"></script>
<script>
    function initPage() {
        const theme = CookieManager.get('theme') || 'light';
        document.body.className = theme;
    }

    function inregistrare() {
        const username = document.getElementById('username').value.trim();
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;
        const confirmPassword = document.getElementById('confirm-password').value;

        // Validari
        if (!username || !email || !password || !confirmPassword) {
            showAlert('Toate câmpurile sunt obligatorii!', 'error');
            return;
        }

        if (username.length < 3) {
            showAlert('Username-ul trebuie să aibă minim 3 caractere!', 'error');
            return;
        }

        const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        if (!emailRegex.test(email)) {
            showAlert('Formatul email-ului este invalid!', 'error');
            return;
        }

        if (password.length < 6) {
            showAlert('Parola trebuie să aibă minim 6 caractere!', 'error');
            return;
        }

        if (password !== confirmPassword) {
            showAlert('Parolele nu coincid!', 'error');
            return;
        }

        const users = StorageManager.getLocal('users') || [];

        if (users.find(u => u.username === username)) {
            showAlert('Username-ul este deja folosit!', 'error');
            return;
        }

        if (users.find(u => u.email === email)) {
            showAlert('Email-ul este deja înregistrat!', 'error');
            return;
        }

        // Adaugare utilizator nou
        const newUser = {
            id: Date.now(),
            username: username,
            password: password,
            email: email
        };
        users.push(newUser);
        StorageManager.setLocal('users', users);

        showAlert('✅ Cont creat cu succes! Redirecționare către login...', 'success');
        setTimeout(() => { window.location.href = 'login.html'; }, 1500);
    }

    function showAlert(msg, type) {
        document.getElementById('alert-box').innerHTML = '<div class="alert-' + type + '">' + msg + '</div>';
    }

    initPage();
</script>
</body>
</html>
