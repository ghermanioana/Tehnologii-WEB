<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Setări Preferințe</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="light">

<nav>
    <a href="index.html">🏠 Acasă</a>
    <a href="preferences.html">⚙ Setări Preferințe</a>
    <a href="cookies-info.html">🍪 Vizualizare Cookies</a>
    <a href="login.html">🔑 Autentificare</a>
</nav>

<div class="container">

    <div class="welcome-card">
        <h1>⚙ Setări Preferințe</h1>
        <p>Personalizează experiența ta pe site.</p>
    </div>

    <div class="section">
        <div class="table-wrapper" style="padding: 24px;">
            <div id="success-msg" class="success-msg" style="display:none;">
                ✅ Preferințele au fost salvate! Vei fi redirecționat...
            </div>

            <div class="form-group">
                <label for="username">Nume utilizator</label>
                <input type="text" id="username" placeholder="Introduceți numele dvs.">
            </div>

            <div class="form-group">
                <label for="theme">Temă</label>
                <select id="theme">
                    <option value="light">☀ Luminos</option>
                    <option value="dark">🌙 Întunecat</option>
                </select>
            </div>

            <div class="form-group">
                <label for="language">Limbă</label>
                <select id="language">
                    <option value="ro">🇷🇴 Română</option>
                    <option value="en">🇬🇧 English</option>
                    <option value="fr">🇫🇷 Français</option>
                </select>
            </div>

            <div class="form-group">
                <label for="fontsize">Dimensiune font</label>
                <select id="fontsize">
                    <option value="14">14px</option>
                    <option value="16">16px</option>
                    <option value="18">18px</option>
                    <option value="20">20px</option>
                </select>
            </div>

            <button class="btn-save" onclick="salveazaPreferinte()">💾 Salvează Preferințele</button>
        </div>
    </div>

</div>

<script src="js/cookies.js"></script>
<script src="js/storage.js"></script>
<script>
    function initPage() {
        const theme = CookieManager.get('theme') || 'light';
        document.body.className = theme;

        const username = CookieManager.get('username') || '';
        document.getElementById('username').value = username;

        const savedTheme = CookieManager.get('theme') || 'light';
        document.getElementById('theme').value = savedTheme;

        const language = StorageManager.getLocal('language') || 'ro';
        document.getElementById('language').value = language;

        const fontsize = StorageManager.getLocal('fontsize') || '16';
        document.getElementById('fontsize').value = fontsize;
    }

    function salveazaPreferinte() {
        const username = document.getElementById('username').value.trim() || 'Vizitator';
        const theme = document.getElementById('theme').value;
        const language = document.getElementById('language').value;
        const fontsize = document.getElementById('fontsize').value;

        CookieManager.set('username', username, 365);
        CookieManager.set('theme', theme, 365);
        StorageManager.setLocal('language', language);
        StorageManager.setLocal('fontsize', fontsize);

        document.body.className = theme;

        const msg = document.getElementById('success-msg');
        msg.style.display = 'block';

        setTimeout(() => {
            window.location.href = 'index.html';
        }, 1500);
    }

    initPage();
</script>

</body>
</html>
